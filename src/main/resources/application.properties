spring.application.name=ticketpass-api

# Base de dados (a mesma do docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketpass
spring.datasource.username=ticketpass
spring.datasource.password=ticketpass

# Cria e actualiza as tabelas automaticamente (só para desenvolvimento)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true