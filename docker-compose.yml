# Sobe a base de dados e o Redis no teu computador:
#   docker compose up -d
# Para desligar:
#   docker compose down
services:
  postgres:
    image: postgres:16
    container_name: ticketpass-postgres
    environment:
      POSTGRES_DB: ticketpass
      POSTGRES_USER: ticketpass
      POSTGRES_PASSWORD: ticketpass   # só para desenvolvimento local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ticketpass-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
